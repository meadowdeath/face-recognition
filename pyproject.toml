[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-landmarks"
version = "0.1.0"
description = "Layered facial landmark demo and future recognition project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "opencv-contrib-python==4.10.0.84",
  "mediapipe==0.10.14",
  "protobuf==4.25.9",
]

[project.scripts]
face-landmarks = "face_recognition.presentation.cli.recognize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

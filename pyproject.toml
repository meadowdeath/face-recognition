[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-landmarks"
version = "0.1.0"
description = "Layered facial landmark demo and future recognition project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mediapipe",
  "opencv-contrib-python",
  "numpy",
  "scikit-learn",
]

[project.scripts]
face-landmarks = "face_recognition.presentation.cli.recognize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
